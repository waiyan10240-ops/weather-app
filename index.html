<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font ကို သုံးထားပါတယ် -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="မြို့နာမည် ရိုက်ထည့်ပါ... (ဥပမာ - Yangon)">
            <button id="search-btn">ရှာမည်</button>
        </div>

        <div class="weather-info" id="weather-info">
            <!-- ရာသီဥတု အချက်အလက်တွေက ဒီမှာ ပေါ်လာပါမယ် -->
            <p class="default-text">မြို့နာမည် ရိုက်ထည့်ပြီး ရှာကြည့်ပါ</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
